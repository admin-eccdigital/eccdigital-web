<!DOCTYPE html>
<html lang="cs">
<head>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta charset="utf-8">
<meta name="ad.size" content="width=300,height=600">
<title>Florea.cz – Tulipány · Portrét (300×600)</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@700;900&family=Source+Sans+3:wght@600;700&display=swap" rel="stylesheet">
<script>var clickTag = "https://www.florea.cz/";</script>
<style>
html,body{margin:0;padding:0;width:300px;height:600px;overflow:hidden;background:#fff}
@keyframes fl-s1img{0%{opacity:0;visibility:visible;transform:scale(1)}4%{opacity:1;transform:scale(1.005)}30%{opacity:1;visibility:visible;transform:scale(1.04)}36%,100%{opacity:0;visibility:hidden;transform:scale(1.05)}}
@keyframes fl-s1head{0%,3%{opacity:0;transform:translateY(10px)}9%{opacity:1;transform:translateY(0)}30%{opacity:1;transform:translateY(0)}34%,100%{opacity:0;transform:translateY(-6px)}}
@keyframes fl-bimg{0%,12%{opacity:0;visibility:visible;transform:translateY(140px)}20%{opacity:1;transform:translateY(0)}30%{opacity:1;visibility:visible;transform:translateY(0) scale(1.02)}36%,100%{opacity:0;visibility:hidden;transform:translateY(0) scale(1.03)}}
@keyframes fl-bhead{0%{opacity:0;transform:translateY(150px) scale(1.4)}5%,12%{opacity:1;transform:translateY(150px) scale(1.4)}20%{opacity:1;transform:translateY(0) scale(1)}30%{opacity:1;transform:translateY(0) scale(1)}34%,100%{opacity:0;transform:translateY(-6px) scale(1)}}
@keyframes fl-prod{0%,33%{opacity:0;visibility:hidden;transform:translate(0,0) scale(.94)}40%{opacity:1;visibility:visible;transform:translate(0,0) scale(1)}67%{opacity:1;transform:translate(0,0) scale(1)}73%,100%{opacity:1;visibility:visible;transform:translate(-46px,12px) scale(.72)}}
@keyframes fl-t1{0%,36%{opacity:0;transform:translateY(10px)}41%{opacity:1;transform:translateY(0)}66%{opacity:1;transform:translateY(0)}69%,100%{opacity:0;transform:translateY(-8px)}}
@keyframes fl-sub1{0%,37.7%{opacity:0;transform:translateY(10px)}42.7%{opacity:1;transform:translateY(0)}66%{opacity:1;transform:translateY(0)}69%,100%{opacity:0;transform:translateY(-8px)}}
@keyframes fl-price{0%,39.3%{opacity:0;transform:translateY(10px)}44.3%,100%{opacity:1;transform:translateY(0)}}
@keyframes fl-cta{0%,41.67%{opacity:0;transform:translateY(12px) scale(1)}46%{opacity:1;transform:translateY(0) scale(1)}87.5%{transform:translateY(0) scale(1)}89.5%{transform:translateY(0) scale(1.07)}91.5%,100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes fl-vase{0%,67%{opacity:0;visibility:hidden;transform:translateX(130px)}74%,100%{opacity:1;visibility:visible;transform:translateX(0)}}
@keyframes fl-pulse{0%{opacity:.45;transform:scale(1)}100%{opacity:1;transform:scale(1.15)}}
@keyframes fl-dark{0%,30%{opacity:1}38%,100%{opacity:0}}
@keyframes fl-t2{0%,70%{opacity:0;transform:translateY(10px)}75%,100%{opacity:1;transform:translateY(0)}}
@keyframes fl-sub2{0%,71.7%{opacity:0;transform:translateY(10px)}76.7%,100%{opacity:1;transform:translateY(0)}}
@keyframes fl-fallA{0%{opacity:0;transform:translate(0,-50px) rotate(0deg) scaleX(1)}4%{opacity:1}14%{transform:translate(14px,90px) rotate(70deg) scaleX(.35)}28%{transform:translate(-4px,240px) rotate(150deg) scaleX(1)}42%{transform:translate(12px,420px) rotate(230deg) scaleX(.4)}50%{opacity:1}56%,100%{opacity:0;transform:translate(-2px,640px) rotate(300deg) scaleX(1)}}
@keyframes fl-fallB{0%{opacity:0;transform:translate(0,-50px) rotate(0deg) scaleY(1)}4%{opacity:1}14%{transform:translate(-14px,90px) rotate(-60deg) scaleY(.4)}28%{transform:translate(4px,240px) rotate(-140deg) scaleY(1)}42%{transform:translate(-12px,420px) rotate(-220deg) scaleY(.35)}50%{opacity:1}56%,100%{opacity:0;transform:translate(2px,640px) rotate(-290deg) scaleY(1)}}
</style>
</head>
<body>
<a id="banner" href="javascript:void(0)" onclick="window.open(window.clickTag,'_blank');return false;" style="display:block;width:300px;height:600px;text-decoration:none;color:inherit">
<div data-banner="1c" style="position:relative;display:block;width:300px;height:600px;cursor:pointer;background:#e9e8e5;overflow:hidden;box-shadow:0 0 0 1px #e2dfda,0 12px 32px rgba(40,30,20,.08);font-family:Lato,sans-serif;color:#222">
<div style="position:absolute;inset:0;background:linear-gradient(172deg,#f2f1ef 0%,#e2e1de 100%);z-index:0"></div><div style="position:absolute;inset:0;background:linear-gradient(172deg,#3b3b3d 0%,#262628 55%,#18181a 100%);animation:fl-dark 12s ease-in-out both;z-index:0"></div><div style="position:absolute;inset:-20%;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.32) 0%,rgba(255,255,255,0) 45%,rgba(0,0,0,.16) 100%);animation:fl-pulse 4.8s ease-in-out infinite alternate;z-index:0"></div><div style="position:absolute;inset:8px;border:1px solid #C6A15B;z-index:7;pointer-events:none"></div>

<img src="assets/logo.png" alt="Florea.cz" style="position:absolute;top:30px;left:75px;width:150px;height:auto;z-index:6"><img src="assets/logo.png" alt="" style="position:absolute;top:30px;left:75px;width:150px;height:auto;z-index:6;filter:brightness(0) invert(1);animation:fl-dark 12s ease-in-out both">
<div style="position:absolute;left:6px;top:168px;width:288px;height:432px;transform-origin:50% 100%;animation:fl-s1img 12s ease-in-out both;z-index:1"></div>
<div style="position:absolute;left:0;right:0;top:84px;text-align:center;font-weight:900;font-size:36px;line-height:1.05;letter-spacing:-.01em;color:#fff;animation:fl-s1head 12s ease-out both;z-index:5"><div>Řekněte to</div><div style="color:#E3C27E">květinou</div></div>
<div style="position:absolute;left:178px;top:120px;width:110px;height:220px;animation:fl-vase 12s cubic-bezier(.2,.7,.2,1) both;z-index:2"><img src="assets/vaza.png" alt="váza" style="display:block;width:100%;height:100%;object-fit:contain"></div>
<div style="position:absolute;left:15px;top:84px;width:270px;height:270px;animation:fl-prod 12s ease-in-out both;z-index:3"><img src="assets/tulipany.png" alt="kytice tulipánů" style="display:block;width:100%;height:100%;object-fit:contain"></div>
<div style="position:absolute;left:0;right:0;top:370px;text-align:center;font-weight:900;font-size:40px;line-height:1;animation:fl-t1 12s ease-out both;z-index:4">Tulipány</div>
<div style="position:absolute;left:0;right:0;top:370px;text-align:center;font-weight:900;font-size:36px;line-height:40px;animation:fl-t2 12s ease-out both;z-index:4">+ váza <span style="color:#CB2435">ZDARMA</span></div>
<div style="position:absolute;left:0;right:0;top:416px;text-align:center;font-family:'Source Sans 3',sans-serif;font-weight:700;font-size:17px;color:#55514c;animation:fl-sub1 12s ease-out both;z-index:4">čerstvé, cena za 1 květ</div>
<div style="position:absolute;left:0;right:0;top:416px;text-align:center;font-family:'Source Sans 3',sans-serif;font-weight:700;font-size:17px;color:#55514c;animation:fl-sub2 12s ease-out both;z-index:4">silnostěnná skleněná váza</div>
<div style="position:absolute;left:0;right:0;top:440px;display:flex;justify-content:center;align-items:baseline;gap:8px;animation:fl-price 12s ease-out both;z-index:4"><span style="font-weight:700;font-size:20px">od</span><span style="font-weight:900;font-size:44px;color:#CB2435;letter-spacing:-.01em">36 Kč</span></div>
<div style="position:absolute;left:30px;top:514px;width:240px;height:46px;display:flex;align-items:center;justify-content:center;background:#2E8B2E;color:#fff;border-radius:6px;font-weight:700;font-size:19px;animation:fl-cta 12s ease-out both;z-index:5">Vybrat tulipány</div>
<div style="position:absolute;left:0;right:0;top:570px;text-align:center;font-family:'Source Sans 3',sans-serif;font-weight:700;font-size:13px;letter-spacing:.02em;color:#55514c;animation:fl-price 12s ease-out both;z-index:5">Objednejte do 17:00, doručíme zítra</div>
</div>
</a>
<script>
(function(){var root=document.getElementById('banner');
function restart(){root.getAnimations({subtree:true}).forEach(function(a){a.currentTime=0;a.play();});}
setInterval(restart,14500);})();
</script>
</body>
</html>
