<!DOCTYPE html>

<style>

@keyframes fl-c2{0%,39%{opacity:0}41%,100%{opacity:1}}
@keyframes fl-c3{0%,59%{opacity:0}61%,100%{opacity:1}}

t both;z-index:5"><div style="font-weight:900;font-size:40px;line-height:1;letter-spacing:-.01em">100 růží</div><div style="font-weight:900;font-size:34px;line-height:1.1;color:#E3C27E;margin-top:4px">již od 850 Kč</div></div><div style="position:absolute;left:30px;top:540px;width:240px;height:44px;display:flex;align-items:center;justify-content:center;background:#2E8B2E;color:#fff;border-radius:6px;font-weight:700;font-size:19px;animation:fl-cta 12s ease-out both;z-index:5">Poslat kytici</div>

<script>
(function(){var root=document.getElementById('banner');
function restart(){root.getAnimations({subtree:true}).forEach(function(a){a.currentTime=0;a.play();});}
setInterval(restart,14500);})();
</script>
