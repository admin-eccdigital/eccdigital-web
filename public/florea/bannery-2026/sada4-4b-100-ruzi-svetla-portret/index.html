<!DOCTYPE html>
<html lang="cs">
<head>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta charset="utf-8">
<meta name="ad.size" content="width=300,height=600">
<title>Florea.cz – 100 růží · Světlá · Portrét (300×600)</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@700;900&family=Source+Sans+3:wght@600;700&display=swap" rel="stylesheet">
<script>var clickTag = "https://www.florea.cz/";</script>
<style>
html,body{margin:0;padding:0;width:300px;height:600px;overflow:hidden;background:#fff}
@keyframes fl-pulse{0%{opacity:.45;transform:scale(1)}100%{opacity:1;transform:scale(1.15)}}
@keyframes fl-cta{0%,60%{opacity:0;transform:translateY(12px) scale(1)}65%{opacity:1;transform:translateY(0) scale(1)}87.5%{transform:translateY(0) scale(1)}89.5%{transform:translateY(0) scale(1.07)}91.5%,100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes fl-model{0%{opacity:0}5%,100%{opacity:1}}
@keyframes fl-c2{0%,24%{opacity:0}26%,100%{opacity:1}}
@keyframes fl-c3{0%,49%{opacity:0}51%,100%{opacity:1}}
@keyframes fl-c4{0%,74%{opacity:0}76%,100%{opacity:1}}
@keyframes fl-h1{0%,3%{opacity:0;transform:translateY(10px)}8%,100%{opacity:1;transform:translateY(0)}}
@keyframes fl-dots{0%,10%{opacity:0;transform:translateY(6px)}15%,100%{opacity:1;transform:translateY(0)}}
@keyframes fl-badge{0%,30%{opacity:0;transform:rotate(-8deg) scale(.3)}36%,100%{opacity:1;transform:rotate(-8deg) scale(1)}}
</style>
</head>
<body>
<a id="banner" href="javascript:void(0)" onclick="window.open(window.clickTag,'_blank');return false;" style="display:block;width:300px;height:600px;text-decoration:none;color:inherit">
<div data-banner="4b" style="position:relative;display:block;width:300px;height:600px;cursor:pointer;overflow:hidden;box-shadow:0 0 0 1px #e2dfda,0 12px 32px rgba(40,30,20,.08);font-family:Lato,sans-serif;color:#222">
<div style="position:absolute;inset:0;background:linear-gradient(172deg,#f5f4f2 0%,#e4e3e0 100%);z-index:0"></div><div style="position:absolute;inset:-20%;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.6) 0%,rgba(255,255,255,0) 45%,rgba(0,0,0,.08) 100%);animation:fl-pulse 4.8s ease-in-out infinite alternate;z-index:0"></div><div style="position:absolute;inset:8px;border:1px solid #C6A15B;border-radius:6px;z-index:1;pointer-events:none"></div><img src="assets/logo.png" alt="Florea.cz" style="position:absolute;top:30px;left:75px;width:150px;height:auto;z-index:6"><div style="position:absolute;left:5px;top:175px;width:290px;height:425px;transform-origin:50% 100%;animation:fl-model 12s ease-out both;z-index:1"><img src="assets/modelka-kristina.webp" alt="" style="position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain;object-position:50% 100%"><img src="assets/modelka-reflex.webp" alt="" style="position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain;object-position:50% 100%;opacity:0;animation:fl-c2 12s ease-in-out both"><img src="assets/modelka-salinero.webp" alt="" style="position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain;object-position:50% 100%;opacity:0;animation:fl-c3 12s ease-in-out both"><img src="assets/modelka-snowflake.webp" alt="" style="position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain;object-position:50% 100%;opacity:0;animation:fl-c4 12s ease-in-out both"></div><div style="position:absolute;left:0;right:0;top:78px;text-align:center;animation:fl-h1 12s ease-out both;z-index:5"><div style="font-weight:900;font-size:40px;line-height:1;letter-spacing:-.01em">100 růží</div><div style="font-family:'Source Sans 3',sans-serif;font-weight:700;font-size:17px;color:#55514c;margin-top:5px">v mnoha různých barvách</div></div><div style="position:absolute;left:176px;top:290px;width:112px;height:112px;border-radius:50%;background:#CB2435;color:#fff;box-shadow:0 0 0 3px #fff,0 10px 22px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;animation:fl-badge 12s cubic-bezier(.34,1.56,.64,1) both;z-index:5"><span style="font-weight:700;font-size:15px;line-height:1">již od</span><span style="font-weight:900;font-size:31px;line-height:1.05;letter-spacing:-.02em">850&nbsp;Kč</span></div><div style="position:absolute;left:30px;top:540px;width:240px;height:44px;display:flex;align-items:center;justify-content:center;background:#2E8B2E;color:#fff;border-radius:6px;font-weight:700;font-size:19px;animation:fl-cta 12s ease-out both;z-index:5">Vybrat barvu</div>
</div>
</a>
<script>
(function(){var root=document.getElementById('banner');
function restart(){root.getAnimations({subtree:true}).forEach(function(a){a.currentTime=0;a.play();});}
setInterval(restart,14500);})();
</script>
</body>
</html>
